name: Documentation validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-validation:
    name: docs-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run app and API tests
        run: npm test
      - name: Typecheck application and API
        run: npm run typecheck
      - name: Build local demo
        run: npm run build
      - name: Audit dependencies
        run: npm audit
      - name: Validate documentation
        run: node scripts/validate-documentation.mjs
      - name: Test documentation validation safeguards
        run: node scripts/documentation-validator.test.mjs
      - name: Test economic scenario arithmetic
        run: node scripts/financial-model.test.mjs
      - name: Validate behaviour contract inventory and safeguards
        run: node scripts/validate-behaviour-contracts.mjs --self-test
      - name: Validate candidate design tokens and contrast safeguards
        run: node scripts/validate-design-tokens.mjs --self-test
