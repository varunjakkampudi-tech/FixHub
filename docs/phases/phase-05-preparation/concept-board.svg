<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fix Hub identity exploration, not an approved identity</title>
  <desc id="desc">Two original vector concepts, a blue and ink palette, English and Telugu type specimens, and sample state treatments. All decisions await owner approval. This is a design board, not a product screen.</desc>
